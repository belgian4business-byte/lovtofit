services:
  postgres:
    image: postgres:16
    container_name: lovtofit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lovtofit
      POSTGRES_PASSWORD: lovtofit
      POSTGRES_DB: lovtofit
    ports:
      - "5432:5432"
    volumes:
      - lovtofit_postgres_data:/var/lib/postgresql/data

volumes:
  lovtofit_postgres_data:
